name: report_bug_grounded
tags:
- reporting
user:
  name: kid
  groups:
  - family
tool_results:
  draft_issue:
  - result:
      draft_id: d1
      title: Document search unavailable
      labels:
      - kind/bug
      - from-chat
      body: 'The document search keeps saying it is unavailable.


        ---

        Filed from the Uriel chat by **kid** on 2026-09-29 10:00 UTC (request `eval`).'
      next: Nothing has been sent yet. Show the person this title and body and ask whether to send it; call file_issue
        with this draft_id only after they say yes.
  file_issue:
  - when:
      draft_id: d1
    result:
      filed: true
      number: 12
      url: https://github.com/TonyHeadband/uriel-agent/issues/12
  - error: 'no such draft (it may have expired): call draft_issue again and show the new draft'
turns:
- say: The document search keeps saying it is unavailable. Can you let Anthony know?
  expect:
    calls:
    - draft_issue
    not_calls:
    - file_issue
    - place_signature
    - fill_form
    - edit_text
    args:
      draft_issue:
        kind: bug
        description:
          contains:
          - unavailable
          not_contains:
          - let anthony know
          - can you
        what_happened:
          not_contains:
          - multiple times
          - several times
          - repeatedly tried
          - restart
    reply:
      not_contains:
      - what title
      - what would you like the title
      - how would you describe
- say: Yes, send it.
  expect:
    calls:
    - file_issue
    args:
      file_issue:
        draft_id: d1
    reply:
      contains_any:
      - '#12'
      - issues/12
      - issue 12
